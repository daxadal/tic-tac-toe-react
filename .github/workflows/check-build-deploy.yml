name: Check, build and deploy

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  base-checks:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: "Install dependencies"
        run: npm ci

      - name: "Build"
        run: npm run build

      - name: "Lint"
        run: npm run lint

  build:
    needs: base-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - architecture: amd64
          - architecture: arm64
    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Docker login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push ${{ matrix.architecture }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.architecture }}
          tags: ghcr.io/${{ github.repository }}:${{ matrix.architecture }}

  publish-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Docker login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Publish multi-architecture image"
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
                  "ghcr.io/${{ github.repository }}:amd64" \
                  "ghcr.io/${{ github.repository }}:arm64"

      - name: "Setup SSH"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy on Oracle Linux
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: SERVICE=${{ github.event.repository.name }} ~/dax-apps/deploy.sh
